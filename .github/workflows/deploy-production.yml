# دیپلوی production — فقط دستی. برای اتصال واقعی، مراحل نمونهٔ زیر را فعال کنید.
#
# GitHub → Environments → production (reviewers + secrets)
# Secrets پیشنهادی: PRODUCTION_SSH_KEY، PRODUCTION_HOST، PRODUCTION_USER

name: Deploy production (manual)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'یادداشت کوتاه برای لاگ دیپلوی (اختیاری)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: راهنما
        run: |
          echo "Staging: از workflow «Deploy staging» استفاده کنید."
          if [ -n "${{ inputs.notes }}" ]; then echo "Notes: ${{ inputs.notes }}"; fi
          echo "::notice::برای SSH می‌توانید appleboy/ssh-action یا rsync با کلید از secrets اضافه کنید."

      # نمونه (غیرفعال) — `if: false` را بردارید و secrets را در GitHub تنظیم کنید:
