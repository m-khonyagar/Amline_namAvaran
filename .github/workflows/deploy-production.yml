name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'seo-dashboard/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST secret is not set"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts || {
            echo "::warning::ssh-keyscan failed for ${{ secrets.DEPLOY_HOST }}"
          }

      - name: Copy files to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='*.pyc' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }}:/opt/amline/app/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'REMOTE'
            set -e
            cd /opt/amline/app

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found on server."
              echo "Run: cp .env.production.example .env && nano .env"
              exit 1
            fi

            echo "==> Pulling latest base images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --ignore-buildable 2>/dev/null || true

            echo "==> Building application images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache backend admin-ui amline-ui consultant-ui site pdf-generator

            echo "==> Starting infrastructure..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d postgres redis minio
            sleep 5

            echo "==> Running database migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm db-init

            echo "==> Initializing MinIO buckets..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm minio-init

            echo "==> Starting all services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Waiting for backend health (90s timeout)..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "Backend is healthy."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "WARNING: Backend health check timed out"
              fi
              echo "Waiting... ($i/30)"
              sleep 3
            done

            echo "==> Deploying nginx config..."
            if [ -f docker/nginx/amline.conf ]; then
              cp docker/nginx/amline.conf /etc/nginx/sites-available/amline
              ln -sf /etc/nginx/sites-available/amline /etc/nginx/sites-enabled/
              if nginx -t 2>&1; then
                systemctl reload nginx
                echo "Nginx config deployed."
              else
                echo "WARNING: Nginx config test failed — skipping reload"
              fi
            fi

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deploy complete."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          REMOTE
