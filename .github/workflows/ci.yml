name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ==================== Backend Tests ====================
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite:///:memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/backend/requirements.txt

      - name: Install dependencies
        working-directory: backend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy pytest-cov types-python-dateutil

      - name: Run linter
        working-directory: backend/backend
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check app/
          isort --check-only app/

      - name: Run type checker
        continue-on-error: true
        working-directory: backend/backend
        run: mypy app/ --ignore-missing-imports

      - name: Run tests
        working-directory: backend/backend
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/backend/coverage.xml
          fail_ci_if_error: false

  # ==================== Monorepo (npm workspaces + Turborepo) ====================
  monorepo-js-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install, lint & build (Turbo)
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu@4.60.1 -w amline-admin-ui
          npm run lint
          npm run build

  # ==================== Frontend HTTP path inventory (drift guard) ====================
  frontend-http-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify committed frontend path inventory
        run: python scripts/inventory_frontend_http_calls.py --check docs/generated/frontend-http-inventory.json

  # ==================== amline-ui E2E (Playwright + dev-mock-api) ====================
  amline-ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev-mock-api dependencies
        working-directory: dev-mock-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: amline-ui/package-lock.json

      - name: Install amline-ui dependencies
        working-directory: amline-ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: amline-ui
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E
        working-directory: amline-ui
        env:
          CI: true
          PW_USE_BUNDLED_CHROMIUM: '1'
        run: npm run test:e2e

  # ==================== admin-ui E2E (Playwright + MSW) ====================
  admin-ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install monorepo & run admin-ui E2E
        working-directory: admin-ui
        env:
          CI: true
        run: |
          cd ..
          npm ci
          npm install @rollup/rollup-linux-x64-gnu@4.60.1 -w amline-admin-ui
          cd admin-ui
          npx playwright install chromium --with-deps
          npm run test:e2e -- tests/e2e.spec.ts

  # ==================== Build Docker Images ====================
  build-backend:
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase GHCR image path
        run: echo "IMAGE_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pdf-generator:
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase GHCR image path
        run: echo "IMAGE_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PDF Generator
        uses: docker/build-push-action@v5
        with:
          context: ./pdf-generator
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/pdf-generator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-ui:
    runs-on: ubuntu-latest
    needs:
      - monorepo-js-build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase GHCR image path
        run: echo "IMAGE_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Admin UI image (monorepo context)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-ui/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/admin-ui:${{ github.sha }}

  build-amline-ui:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase GHCR image path
        run: echo "IMAGE_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Amline UI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./amline-ui/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/amline-ui:${{ github.sha }}

  build-site:
    runs-on: ubuntu-latest
    needs:
      - monorepo-js-build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase GHCR image path
        run: echo "IMAGE_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Site image (monorepo context)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./site/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/site:${{ github.sha }}

  build-seo-dashboard:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: seo-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: seo-dashboard
        run: npm ci

      - name: Run linter
        working-directory: seo-dashboard
        run: npm run lint

      - name: Build SEO Dashboard
        working-directory: seo-dashboard
        run: npm run build
