name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Admin UI ──────────────────────────────────────────────────
  admin-ui-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --run

  # ── Backend ───────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run migrations
        env:
          AMLINE_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          AMLINE_REDIS_URL: redis://localhost:6379/0
          AMLINE_JWT_SECRET: ci-test-secret-key-32-chars-minimum
        run: alembic upgrade head
      - name: Run tests
        env:
          AMLINE_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          AMLINE_REDIS_URL: redis://localhost:6379/0
          AMLINE_JWT_SECRET: ci-test-secret-key-32-chars-minimum
          AMLINE_S3_ENDPOINT_URL: ""
        run: python -m pytest tests/ -v --tb=short -x

  # ── Amline user UI (Playwright + dev-mock-api) ────────────────
  amline-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: amline-ui/package-lock.json
      - run: npm ci
        working-directory: amline-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev-mock-api dependencies
        run: pip install -r dev-mock-api/requirements.txt
      - name: Install Playwright Chromium
        working-directory: amline-ui
        run: npx playwright install --with-deps chromium
        env:
          PW_USE_BUNDLED_CHROMIUM: '1'
      - name: E2E (amline-ui)
        working-directory: amline-ui
        run: npm run test:e2e
        env:
          CI: true
          PW_USE_BUNDLED_CHROMIUM: '1'

  # ── Build Docker images (push to main only) ───────────────────
  build:
    runs-on: ubuntu-latest
    needs: [admin-ui-quality, backend-test, amline-ui-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [backend, admin-ui, amline-ui, consultant-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: amline/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
