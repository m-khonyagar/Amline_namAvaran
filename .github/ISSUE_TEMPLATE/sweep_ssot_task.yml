name: Sweep SSOT task
description: Task for Sweep AI — Amline SSOT v2.0 (use label `sweep` + title prefix `Sweep:`).
title: "Sweep: "
labels:
  - sweep
body:
  - type: markdown
    attributes:
      value: |
        **Sweep AI** will implement this issue. Title must start with `Sweep:` (already set).  
        After submit, add label **`sweep`** if the form did not apply it.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome is required?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Backend, admin-ui, amline-ui, tests, docs — be specific.
    validations:
      required: true

  - type: textarea
    id: ssot
    attributes:
      label: SSOT Alignment
      description: Section references (e.g. SSOT v2.0 §3.2 Party model) or link to in-repo docs.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Checklist Sweep must satisfy (tests, CI, API shape).
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Dependencies, related issues (#19 epic, #9–#18), feature flags.
    validations:
      required: false
