<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>املاین — هاب توسعهٔ محلی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4d;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent2: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Vazirmatn", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem clamp(1rem, 4vw, 2rem);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #151c28 0%, var(--bg) 100%);
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.5rem; font-weight: 700; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .actions {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .actions button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .actions button.primary {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      border-color: transparent;
      font-weight: 600;
    }
    .actions button:hover { filter: brightness(1.08); }
    main {
      padding: 1rem clamp(0.5rem, 2vw, 1.5rem) 3rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }
    .sec-head {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .sec-head strong { font-size: 0.95rem; }
    .sec-head span { font-size: 0.8rem; color: var(--muted); }
    .sec-head a {
      color: var(--accent2);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .sec-head a:hover { text-decoration: underline; }
    .frame-wrap {
      flex: 1;
      background: #0a0e14;
      position: relative;
      min-height: 360px;
    }
    .frame-wrap iframe {
      width: 100%;
      height: 100%;
      min-height: 360px;
      border: 0;
      display: block;
    }
    .frame-fallback {
      display: none;
      padding: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .frame-wrap.blocked .frame-fallback { display: block; }
    .frame-wrap.blocked iframe { display: none; }
    footer {
      text-align: center;
      padding: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>هاب توسعهٔ محلی — اَملاین</h1>
    <p>پیش‌نمایش همهٔ اپ‌های لوکال در یک صفحه. اگر iframe به‌خاطر امنیت خالی بود، لینک «باز در تب» را بزنید.</p>
    <div class="actions">
      <button type="button" class="primary" id="openAll">باز کردن همه در تب‌های جدید</button>
      <button type="button" id="reloadFrames">تازه‌سازی پیش‌نماها</button>
    </div>
  </header>
  <main>
    <div class="grid" id="apps"></div>
  </main>
  <footer>dev-mock-api :8080 · amline-ui :3000 · site :3001 · admin-ui :3002 · seo-dashboard :3003 · consultant-ui :3004</footer>
  <script>
    const APPS = [
      { name: "API ماک (Health)", port: 8080, path: "/health", desc: "JSON وضعیت سرویس" },
      { name: "پنل کاربر — amline-ui", port: 3000, path: "/", desc: "Next.js 14" },
      { name: "سایت بازاریابی — site", port: 3001, path: "/", desc: "Next.js 15" },
      { name: "پنل ادمین — admin-ui", port: 3002, path: "/dashboard", desc: "Vite + React" },
      { name: "داشبورد سئو", port: 3003, path: "/", desc: "Next.js" },
      { name: "پنل مشاور — consultant-ui", port: 3004, path: "/", desc: "Vite" },
    ];
    const base = (p, path) => `http://localhost:${p}${path}`;
    const grid = document.getElementById("apps");
    APPS.forEach((app) => {
      const url = base(app.port, app.path);
      const sec = document.createElement("section");
      sec.innerHTML = `
        <div class="sec-head">
          <div>
            <strong>${app.name}</strong>
            <span>${app.desc} — پورت ${app.port}</span>
          </div>
          <a href="${url}" target="_blank" rel="noopener">باز در تب جدید ↗</a>
        </div>
        <div class="frame-wrap" data-url="${url}">
          <iframe src="${url}" title="${app.name}" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
          <div class="frame-fallback">این اپ اجازهٔ نمایش داخل قاب را نمی‌دهد (مثلاً X-Frame-Options). از لینک بالا استفاده کنید.</div>
        </div>
      `;
      grid.appendChild(sec);
      const wrap = sec.querySelector(".frame-wrap");
      const iframe = sec.querySelector("iframe");
      iframe.addEventListener("load", () => {
        try {
          if (!iframe.contentWindow || !iframe.contentWindow.document) return;
        } catch (e) {
          wrap.classList.add("blocked");
        }
      });
      iframe.addEventListener("error", () => wrap.classList.add("blocked"));
    });
    document.getElementById("openAll").addEventListener("click", () => {
      APPS.forEach((app) => window.open(base(app.port, app.path), "_blank"));
    });
    document.getElementById("reloadFrames").addEventListener("click", () => {
      document.querySelectorAll("iframe").forEach((f) => { f.src = f.src; });
    });
  </script>
</body>
</html>
