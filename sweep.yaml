# Sweep AI — Amline_namAvaran
# Keep `sweep.yaml` and `.sweep.yaml` identical. The Sweep GitHub App reads `sweep.yaml` at repo root.

gha_enabled: true
branch: main
draft: false

description: >
  Amline_namAvaran is a multi-service property contract platform. SSOT for product and architecture:
  treat "Amline Complete Product Master Specification v2.0" as the authoritative product contract;
  in-repo execution SSOT is docs/AMLINE_MASTER_SPEC.md (evolving master) plus
  docs/AMLINE_REFERENCE_V2_2.md (deep domain). Production backend: backend/backend (FastAPI,
  PostgreSQL, /api/v1/*). Frontends: amline-ui (Next.js App Router), site (Next.js export),
  admin-ui (Vite/React). Optional: dev-mock-api. Stack: Docker Compose, Postgres, Redis, MinIO.
  Sweep must behave as a dependency-aware, multi-file, multi-service agent: preserve domain
  boundaries, contract lifecycle integrity, audit/ledger immutability, Temporal long-running
  workflows where present, and frontend-backend coupling for contract/signature/payment flows.
  API integration patterns: docs/FRONTEND_API_INTEGRATION.md. Prefer production-grade code,
  strong validation, ErrorResponse consistency, and backward-compatible changes when possible.

# Repository intelligence (Mother-Builder / orchestration consumers; also mirrored in rules for Sweep)
repo_intelligence:
  enable_dependency_graph: true
  enable_cross_service_mapping: true
  enable_contract_model_awareness: true
  enable_frontend_backend_coupling_awareness: true
  enable_temporal_workflow_awareness: true
  enable_audit_immutability_rules: true

# Structured SSOT enforcement (orchestration + docs; Sweep rules array below reinforces behavior)
product_spec_enforcement:
  contract_types:
    - RENT
    - SALE
    - EXCHANGE
    - CONSTRUCTION
    - PRE_SALE
    - LEASE_TO_OWN
  flows:
    signatures: [S1, S2, S3, S4, S5]
    payments: [P1, P2, P3, P4]
    combined: [T1]
  domain_services:
    - Auth
    - Listing
    - CRM
    - Visit
    - Contract
    - Payment
    - Billing
    - ML Pricing
    - Temporal
    - Matrix
    - Audit
  rules:
    - Contract model must remain unified across all services.
    - Party model must support natural/legal entities.
    - All Terms must follow the SSOT definitions.
    - Commission logic must follow the SSOT.
    - Signature flows must follow S1–S5 exactly.
    - Payment flows must follow P1–P4 exactly.
    - Combined flow T1 must be preserved.
    - No service may violate domain boundaries.
    - No code may bypass audit immutability.

# Desired agent behavior flags (orchestration / policy as code; reinforced in rules)
agent_behavior:
  multi_file_edits: true
  multi_service_edits: true
  refactor_across_modules: true
  detect_architecture_violations: true
  enforce_business_rules: true
  auto_generate_tests: true
  auto_update_docs: true
  auto_fix_inconsistencies: true
  prefer_backward_compatible_changes: true
  commit_style: structured

# product_spec_rules — Sweep consumes operational guidance primarily via `rules:` below
rules:
  - "SSOT: Amline Complete Product Master Specification v2.0 (conceptual) and in-repo docs/AMLINE_MASTER_SPEC.md + docs/AMLINE_REFERENCE_V2_2.md; enforce contract types RENT, SALE, EXCHANGE, CONSTRUCTION, PRE_SALE, LEASE_TO_OWN and unified Contract/Party/Terms/Commission."
  - "Flows: signatures S1–S5, payments P1–P4, combined T1 — no ad-hoc shortcuts; lifecycle and validation must stay consistent across backend/backend, amline-ui, admin-ui, and site."
  - "Domain boundaries: Auth, Listing, CRM, Visit, Contract, Payment, Billing, ML Pricing, Temporal, Matrix, Audit — no cross-domain leakage; Audit/Ledger entries must remain immutable (append-only semantics, no silent rewrite of historical audit)."
  - "Repo intelligence: map dependencies and cross-service impact before editing; trace contract flows through API and UI; respect Temporal workflow boundaries where code uses Temporal; couple frontend changes to backend contracts and OpenAPI/ErrorResponse patterns."
  - "Agent behavior: prefer multi-file, multi-service edits when the feature demands it; refactor across modules when it reduces violations; detect architecture/business-rule drift vs SSOT; add/update tests and docs alongside logic; prefer backward-compatible API and schema changes; use structured commit messages (type/scope/summary)."
  - "Backend: backend/backend only for production DB paths; Alembic for schema; idempotent payments and RBAC as documented."
  - "Quality: Python type hints, strict TypeScript, no secrets in code, no debug print in production paths."

blocked_dirs:
  - node_modules/
  - .next/
  - dist/
  - build/
  - coverage/
  - .venv/
  - venv/

include_exts:
  - ".py"
  - ".md"
  - ".txt"
  - ".ts"
  - ".tsx"
  - ".js"
  - ".jsx"
  - ".mjs"
  - ".cs"
  - ".csharp"
  - ".yaml"
  - ".yml"
  - ".json"
  - ".sql"

docs:
  master_spec: docs/AMLINE_MASTER_SPEC.md
  domain_reference: docs/AMLINE_REFERENCE_V2_2.md
  frontend_api: docs/FRONTEND_API_INTEGRATION.md
  architecture_contract: docs/ARCHITECTURE_CONTRACT_PLATFORM_PRODUCTION.md
