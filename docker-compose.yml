version: '3.8'

services:
  # ==================== Infrastructure ====================
  postgres:
    image: postgres:15-alpine
    container_name: amline-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amline_secret}
      POSTGRES_DB: ${POSTGRES_DB:-amline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amline}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amline-network

  redis:
    image: redis:7-alpine
    container_name: amline-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-amline_redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-amline_redis_secret}\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amline-network

  minio:
    image: minio/minio:latest
    container_name: amline-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-amline}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-amline_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - amline-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: amline-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-amline}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-amline_rabbitmq_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - amline-network
    profiles:
      - optional

  # ==================== Backend Services ====================
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
      args:
        AMLINE_PYTHON_BASE: ${AMLINE_PYTHON_BASE:-python:3.12-slim-bookworm}
        AMLINE_PIP_INDEX_URL: ${AMLINE_PIP_INDEX_URL:-}
      extra_hosts:
        - "mirror.arvancloud.ir:185.143.233.235"
    container_name: amline-backend
    environment:
      - AMLINE_ENV=staging
      # FastAPI app/db/session.py reads DATABASE_URL (SQLAlchemy)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amline}:${POSTGRES_PASSWORD:-amline_secret}@postgres:5432/${POSTGRES_DB:-amline}
      - AMLINE_DATABASE_URL=postgresql://${POSTGRES_USER:-amline}:${POSTGRES_PASSWORD:-amline_secret}@postgres:5432/${POSTGRES_DB:-amline}
      - AMLINE_REDIS_URL=redis://:${REDIS_PASSWORD:-amline_redis_secret}@redis:6379/0
      - AMLINE_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AMLINE_JWT_ISSUER=amline
      - AMLINE_JWT_ACCESS_MINUTES=60
      - AMLINE_JWT_REFRESH_DAYS=30
      - AMLINE_S3_ENDPOINT_URL=http://minio:9000
      - AMLINE_S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-amline}
      - AMLINE_S3_SECRET_KEY=${MINIO_SECRET_KEY:-amline_minio_secret}
      - AMLINE_S3_BUCKET=amline-docs
      - AMLINE_BOOTSTRAP_ADMIN_MOBILE=${BOOTSTRAP_ADMIN_MOBILE:-09120000000}
      - AMLINE_METRICS_ENABLED=${AMLINE_METRICS_ENABLED:-1}
      # Staging stack: demo OTP on by default; set AMLINE_OTP_MAGIC_ENABLED=0 in .env to disable
      - AMLINE_OTP_MAGIC_ENABLED=${AMLINE_OTP_MAGIC_ENABLED:-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - amline-network

  pdf-generator:
    build:
      context: ./pdf-generator
      dockerfile: Dockerfile
      args:
        AMLINE_PYTHON_BASE: ${AMLINE_PYTHON_BASE:-python:3.12-slim-bookworm}
        AMLINE_PIP_INDEX_URL: ${AMLINE_PIP_INDEX_URL:-}
      extra_hosts:
        - "mirror.arvancloud.ir:185.143.233.235"
    container_name: amline-pdf-generator
    environment:
      - APP_ENV=staging
      - APP_DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-amline}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-amline_minio_secret}
      - MINIO_BUCKET=contracts
    ports:
      - "8001:8000"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - amline-network

  # ==================== Frontend Applications ====================
  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
      args:
        # برای استیجینگ عمومی: https://amline-backend-staging.darkube.app — برای لوکال خالی بگذارید تا nginx/paths نسبی
        VITE_API_URL: ${VITE_STAGING_API_URL:-}
        VITE_USE_MSW: ${VITE_ADMIN_USE_MSW:-false}
        VITE_ENABLE_DEV_BYPASS: ${VITE_ADMIN_DEV_BYPASS:-false}
        VITE_USE_CRM_API: ${VITE_ADMIN_USE_CRM_API:-true}
    container_name: amline-admin-ui
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - amline-network

  amline-ui:
    build:
      context: .
      dockerfile: amline-ui/Dockerfile
    container_name: amline-ui
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
      - NEXT_PUBLIC_ENABLE_DEV_BYPASS=false
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - amline-network

  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    container_name: amline-site
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - amline-network

  # ==================== SEO Dashboard ====================
  seo-dashboard:
    build:
      context: ./seo-dashboard
      dockerfile: Dockerfile
    container_name: amline-seo-dashboard
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GSC_DATA_PATH=/app/data/gsc/gsc_full_export.json
    volumes:
      - ./seo-dashboard/data/gsc:/app/data/gsc:ro
    ports:
      - "3003:3003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - amline-network

  # ==================== Init Services ====================
  db-init:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
      args:
        AMLINE_PYTHON_BASE: ${AMLINE_PYTHON_BASE:-python:3.12-slim-bookworm}
        AMLINE_PIP_INDEX_URL: ${AMLINE_PIP_INDEX_URL:-}
      extra_hosts:
        - "mirror.arvancloud.ir:185.143.233.235"
    container_name: amline-db-init
    environment:
      - AMLINE_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-amline}:${POSTGRES_PASSWORD:-amline_secret}@postgres:5432/${POSTGRES_DB:-amline}
      - AMLINE_REDIS_URL=redis://:${REDIS_PASSWORD:-amline_redis_secret}@redis:6379/0
      - AMLINE_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AMLINE_S3_ENDPOINT_URL=http://minio:9000
      - AMLINE_S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-amline}
      - AMLINE_S3_SECRET_KEY=${MINIO_SECRET_KEY:-amline_minio_secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for database..."
        sleep 10
        echo "Running migrations..."
        alembic upgrade head
        echo "Migrations done."
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - amline-network

  minio-init:
    image: minio/mc:latest
    container_name: amline-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-amline}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-amline_minio_secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-amline} ${MINIO_SECRET_KEY:-amline_minio_secret}
        mc mb myminio/public --ignore-existing
        mc mb myminio/private --ignore-existing
        mc mb myminio/contracts --ignore-existing
        mc anonymous set download myminio/public
        mc anonymous set download myminio/contracts
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - amline-network

  # ==================== Integrations (docker compose --profile integrations) ====================
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: amline-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-dev_master_key}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - amline-network
    profiles:
      - integrations

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: amline-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - amline-network
    profiles:
      - integrations

  thumbor:
    image: minimalcompact/thumbor:latest
    container_name: amline-thumbor
    environment:
      THUMBOR_SECURITY_KEY: ${THUMBOR_SECURITY_KEY:-amline_thumbor_dev}
    ports:
      - "8888:80"
    networks:
      - amline-network
    profiles:
      - integrations

  metabase-db-init:
    image: postgres:15-alpine
    container_name: amline-metabase-db-init
    environment:
      PGUSER: ${POSTGRES_USER:-amline}
      PGPASSWORD: ${POSTGRES_PASSWORD:-amline_secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until pg_isready -h postgres; do sleep 2; done
        psql -h postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'metabase'" | grep -q 1 || psql -h postgres -d postgres -c "CREATE DATABASE metabase;"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - amline-network
    profiles:
      - integrations

  metabase:
    image: metabase/metabase:v0.49.23
    container_name: amline-metabase
    ports:
      - "3005:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-amline}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-amline_secret}
      MB_DB_HOST: postgres
    depends_on:
      metabase-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - amline-network
    profiles:
      - integrations

  tempo:
    image: grafana/tempo:2.3.1
    container_name: amline-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - amline-network
    profiles:
      - integrations

  grafana:
    image: grafana/grafana:10.2.3
    container_name: amline-grafana
    ports:
      - "3010:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - amline-network
    profiles:
      - integrations

  loki:
    image: grafana/loki:2.9.3
    container_name: amline-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - amline-network
    profiles:
      - integrations

  promtail:
    image: grafana/promtail:2.9.3
    container_name: amline-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/promtail-config.yaml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    networks:
      - amline-network
    profiles:
      - integrations

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: amline-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - amline-network
    profiles:
      - integrations

  temporal-postgresql:
    image: postgres:15-alpine
    container_name: amline-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    networks:
      - amline-network
    profiles:
      - integrations

  temporal:
    image: temporalio/auto-setup:1.22.7
    container_name: amline-temporal
    depends_on:
      - temporal-postgresql
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
      - "8233:8233"
    networks:
      - amline-network
    profiles:
      - integrations

  temporal-worker:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    container_name: amline-temporal-worker
    command: ["python", "-m", "app.temporal.run_worker"]
    environment:
      AMLINE_TEMPORAL_HOST: temporal:7233
    depends_on:
      - temporal
    networks:
      - amline-network
    profiles:
      - integrations

  ml-pricing:
    build:
      context: ./services/ml-pricing
      dockerfile: Dockerfile
    container_name: amline-ml-pricing
    ports:
      - "8090:8090"
    networks:
      - amline-network
    profiles:
      - integrations

  synapse:
    image: matrixdotorg/synapse:v1.115.0
    container_name: amline-synapse
    volumes:
      - matrix_synapse_data:/data
    ports:
      - "8008:8008"
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: "no"
    networks:
      - amline-network
    profiles:
      - integrations

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: amline-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - amline-network
    profiles:
      - integrations

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  meilisearch_data:
  n8n_data:
  temporal_pg_data:
  loki_data:
  matrix_synapse_data:

networks:
  amline-network:
    driver: bridge
