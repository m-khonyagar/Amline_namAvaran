# ──────────────────────────────────────────────────────────────
# Amline Platform — Nginx Reverse Proxy Configuration
# ──────────────────────────────────────────────────────────────
# Install: cp docker/nginx/amline.conf /etc/nginx/sites-available/amline
#          ln -sf /etc/nginx/sites-available/amline /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# After DNS is ready, enable HTTPS:
#   certbot --nginx -d app.amline.ir -d admin.amline.ir -d amline.ir -d api.amline.ir
# ──────────────────────────────────────────────────────────────

# ── Rate limiting zones ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ── Backend API (api.amline.ir) ──────────────────────────────
server {
    listen 80;
    server_name api.amline.ir;

    client_max_body_size 50M;

    location / {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Stricter rate limit on auth endpoints
    location ~ ^/(api/v1/)?(auth|otp)/ {
        limit_req zone=login_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}

# ── User Application (app.amline.ir) ────────────────────────
server {
    listen 80;
    server_name app.amline.ir;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Admin Panel (admin.amline.ir) ────────────────────────────
server {
    listen 80;
    server_name admin.amline.ir;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Marketing Site (amline.ir / www.amline.ir) ───────────────
server {
    listen 80;
    server_name amline.ir www.amline.ir;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Consultant Panel (consultant.amline.ir) ──────────────────
server {
    listen 80;
    server_name consultant.amline.ir;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── SEO Dashboard (seo.amline.ir) ────────────────────────────
server {
    listen 80;
    server_name seo.amline.ir;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Default: reject unknown hosts ────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
